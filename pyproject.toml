[project]
name = "indo-audio-transcribe"
version = "0.1.0"
description = "Turn Indonesian recordings into text — local web app and CLI, CPU only, built on PixelML/sea-asr-id"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Not on PyPI; installed from the upstream tag. Keep this in step with
  # SEA_ASR_REF in transcribe.sh, which is what the CLI actually installs.
  "sea-asr @ git+https://github.com/PixelML/sea-asr@v0.2.1",
  "fastapi",
  "uvicorn",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
# The parity suite loads the model in `lm` mode, which needs the language model
# extra. Kept out of `dev` because its kenlm build is a C++ compile that the fast
# suite should never force on anyone.
slow = ["pytest", "httpx", "sea-asr[lm] @ git+https://github.com/PixelML/sea-asr@v0.2.1"]

[project.urls]
Homepage = "https://github.com/ahsanmubariz/indo-audio-transcribe"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
# The fast suite is the default. Model tests are opted into with `-m slow`.
addopts = "-m 'not slow' -q"
markers = [
  "slow: drives the real PixelML/sea-asr-id model; needs a reference recording and MYTRANSCRIBE_RUN_SLOW=1",
]

[tool.setuptools.packages.find]
include = ["mytranscribe*"]